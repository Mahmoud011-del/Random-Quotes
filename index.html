<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Random Qoutes Generator</h1>
    <div class="quotes">
        <span class="qoute-id">0</span>
        <div class="qoute-display">
            Qoutes will appear here
        </div>
        <div class="buttons">
            <button class="generate">Generate Qoutes</button>
            <button class="auto">Auto Generate </button>
            <button class="stop">Stop Generate </button>
        </div>
    </div>
    <div class="auto-status"> </div>
    <script src="./script.js"></script>
</body>
</html>
